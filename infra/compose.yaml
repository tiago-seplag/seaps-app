services:
  database:
    container_name: database
    ports:
      - 5432:5432
    image: postgres:16.0-alpine3.18
    env_file:
      - ../.env

  nginx:
    image: nginx:1.19-alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - seaps-net

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "4566:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: seaps-bucket
    volumes:
      - minio-data:/data
      - ./minio-init:/etc/minio/init
    command: server /data --console-address ":9001"
    networks:
      - seaps-net

networks:
  seaps-net:
    driver: bridge

volumes:
  minio-data:
    external: true
    name: minio_data
